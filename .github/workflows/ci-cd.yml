name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

  build:
    name: Docker Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t moneymap-backend .

      - name: Container smoke test
        run: |
          docker run -d -p 5000:5000 -e PORT=5000 -e JWT_SECRET=ci-secret moneymap-backend
          sleep 5
          curl -f http://localhost:5000/health

  deploy:
    name: Continuous Deployment (Render)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not configured yet in GitHub Secrets."
            echo "Skipping deploy step. Add RENDER_DEPLOY_HOOK in Settings -> Secrets -> Actions to enable auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "${DEPLOY_HOOK}&ref=${{ github.sha }}"
